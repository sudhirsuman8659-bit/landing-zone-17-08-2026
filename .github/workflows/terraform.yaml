name: Terraform Pipeline

on:
  push:
    branches:
      - feature/resources
      - main

jobs:

  # ==========================================
  # FEATURE BRANCH - PLAN ONLY
  # ==========================================
  feature-plan:
    runs-on: [self-hosted, Windows, X64]
    if: github.ref == 'refs/heads/feature/resources'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: ./environment/prod
        run: terraform init

      - name: Terraform Validate
        working-directory: ./environment/prod
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./environment/prod
        run: terraform plan


  # ==========================================
  # MAIN BRANCH - PLAN
  # ==========================================
  main-plan:
    runs-on: [self-hosted, Windows, X64]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: ./environment/prod
        run: terraform init

      - name: Terraform Validate
        working-directory: ./environment/prod
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./environment/prod
        run: terraform plan


  # ==========================================
  # MAIN BRANCH - APPLY
  # ==========================================
  production-apply:
    runs-on: [self-hosted, Windows, X64]
    if: github.ref == 'refs/heads/main'
    needs: main-plan

    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Init
        working-directory: ./environment/prod
        run: terraform init

      - name: Terraform Apply
        working-directory: ./environment/prod
        run: terraform apply -auto-approve